<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150a0d">
<title>Oliver's Stag · 16–18 October</title>
<meta name="description" content="A weekend of vines, sea air & good company. Friday 16 – Sunday 18 October, Kent.">
<meta property="og:title" content="Oliver's Stag · 16–18 October">
<meta property="og:description" content="A weekend of vines, sea air & good company in Kent.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
:root{
  --bg:#150a0d; --wine:#6b1d2a; --wine-hi:#8e2a3a;
  --gold:#c9a35c; --gold-hi:#ecd29a; --cream:#efe4d2; --muted:#ab9a8f; --line:rgba(201,163,92,.25);
  --gutter:20px; --node:52px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 140% 60% at 50% 0%,#2c1118 0%,transparent 70%);
  color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;
  overflow-x:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.sc{font-family:'Cormorant SC',serif;letter-spacing:.16em;font-weight:500}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ——— Hero ——— */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(60px + var(--sat)) var(--gutter) calc(110px + var(--sab));position:relative}
.eyebrow{color:var(--gold);font-size:14px;opacity:0;animation:fadeUp 1.2s .2s forwards}
.foil{
  font-size:clamp(76px,22vw,210px);font-weight:300;font-style:italic;line-height:1;margin:.1em 0 -.12em;padding:0 .12em .2em;
  background:linear-gradient(100deg,#8f6d34 0%,#ecd29a 18%,#b38945 36%,#f7e6b9 50%,#a57e3d 66%,#e6c98a 84%,#8f6d34 100%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:settle 2.2s cubic-bezier(.2,.7,.2,1) .35s both, foil 7s linear 2.5s infinite;
}
@keyframes settle{from{letter-spacing:.3em;opacity:0;filter:blur(12px)}to{letter-spacing:0;opacity:1;filter:blur(0)}}
@keyframes foil{to{background-position:-220% center}}
.honour{color:var(--gold);font-size:clamp(15px,4vw,18px);margin:-.1em 0 18px;opacity:0;animation:fadeUp 1.2s 1.1s forwards}
.honour span{color:var(--gold-hi)}
.lede{font-size:clamp(22px,5.4vw,30px);font-weight:300;line-height:1.3;max-width:20ch;opacity:0;animation:fadeUp 1.2s 1.3s forwards}
.rule{display:flex;align-items:center;gap:16px;color:var(--gold);margin:24px 0 18px;opacity:0;animation:fadeUp 1s 1.6s forwards}
.rule span{display:block;width:clamp(50px,18vw,90px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule span:last-child{transform:scaleX(-1)}
.dates{color:var(--muted);font-size:14px;line-height:1.7;opacity:0;animation:fadeUp 1s 1.8s forwards}
.status{margin-top:34px;min-height:100px;width:100%;display:flex;justify-content:center;opacity:0;animation:fadeUp 1s 2.1s forwards}
.status>*{animation:swap .9s cubic-bezier(.2,.7,.2,1)}
.status>.count{animation:none}
@keyframes swap{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,4vw,28px)}
.count.zero b{color:var(--cream);text-shadow:0 0 18px rgba(236,210,154,.8);transition:all .4s}
.begun{font-size:clamp(46px,13vw,68px);font-style:italic;font-weight:300;line-height:1;color:var(--gold-hi);text-shadow:0 0 30px rgba(236,210,154,.35)}
.live{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
.live-tag,.nowtag{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:#e6bd72;flex:none;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,189,114,.65)}70%,100%{box-shadow:0 0 0 10px rgba(230,189,114,0)}}
.live-now{font-size:clamp(32px,9vw,46px);line-height:1.08;color:var(--cream);text-decoration:none;text-wrap:balance;border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .3s}
.live-now:active,.live-now:hover{border-color:var(--gold)}
.live-next{color:var(--muted);font-size:18px;font-style:italic;text-wrap:balance}
.wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.wrap b{font-size:clamp(44px,12vw,62px);font-weight:300;font-style:italic;line-height:1;color:var(--gold-hi)}
.wrap small{font-family:'Cormorant SC',serif;letter-spacing:.16em;font-size:13px;color:var(--muted)}
.count div{display:flex;flex-direction:column;align-items:center;min-width:58px}
.count b{font-weight:300;font-size:clamp(34px,10vw,46px);line-height:1;color:var(--gold-hi);font-variant-numeric:lining-nums tabular-nums}
.count small{font-family:'Cormorant SC',serif;letter-spacing:.16em;font-size:12px;color:var(--muted);margin-top:6px}
.cue{position:absolute;bottom:calc(28px + var(--sab));left:0;right:0;margin:auto;width:max-content;color:var(--gold);text-decoration:none;font-size:14px;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 16px;opacity:0;animation:fade 1s 2.6s forwards}
.cue i{display:block;width:1px;height:42px;background:linear-gradient(var(--gold),transparent);transform-origin:top;animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}

/* ——— Day heads ——— */
.day{position:relative;padding:12vh 0 2vh}
.day-head{text-align:center;padding:0 var(--gutter) 6vh;position:relative}
.ghost{position:absolute;left:50%;top:-3vh;font-size:clamp(110px,30vw,320px);font-style:italic;font-weight:300;line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(201,163,92,.13);white-space:nowrap;pointer-events:none;z-index:0;transform:translateX(-50%);will-change:transform}
.seal{width:84px;height:84px;margin:0 auto 18px;position:relative;z-index:1;opacity:0;transform:scale(1.8) rotate(-25deg)}
.day-head.in .seal{animation:stamp .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{60%{opacity:1;transform:scale(.92) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.seal text{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;fill:#e8b9a0;opacity:.85}
.day-date{color:var(--gold);font-size:14px;position:relative;z-index:1}
.day-name{font-size:clamp(60px,17vw,104px);font-weight:300;line-height:1;margin:.08em 0 .14em;position:relative;z-index:1}
.day-theme{text-wrap:balance;font-size:clamp(20px,5vw,24px);color:var(--muted);position:relative;z-index:1;max-width:30ch;margin:0 auto;line-height:1.35}
.day-theme em{color:var(--cream);display:block}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ——— Timeline (mobile first) ——— */
.events{position:relative;max-width:1040px;margin:0 auto;padding:0 var(--gutter) 10px calc(var(--gutter) - 6px)}
.vine{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.vine path{fill:none;stroke:#6e7d3a;stroke-width:1.6;stroke-linecap:round}
.vine .shadow{stroke:rgba(0,0,0,.45);stroke-width:4}
.ev{display:grid;grid-template-columns:var(--node) 1fr;column-gap:10px;align-items:start;padding:18px 0 26px;position:relative}
.ev .node{grid-column:1;grid-row:1;padding-top:4px}
.ev .card{grid-column:2;grid-row:1}
.node{display:flex;justify-content:center;position:relative;z-index:2}
.node svg{width:46px;height:55px;overflow:visible}
.grape{fill:#56622b;transform:scale(.15);transform-box:fill-box;transform-origin:center;transition:fill 1.6s ease, transform .9s cubic-bezier(.3,1.7,.5,1)}
.ev.in .grape{fill:#5c1832;transform:scale(1)}
.grape-hi{fill:#fff;opacity:0;transition:opacity 1s 1s}
.ev.in .grape-hi{opacity:.22}
.leafy{fill:#4b5a26;opacity:0;transform:scale(.3) rotate(-30deg);transform-box:fill-box;transform-origin:left bottom;transition:all 1s cubic-bezier(.3,1.5,.5,1) .2s}
.ev.in .leafy{opacity:1;transform:none}
.card{position:relative;padding:4px 0 0;opacity:0;transform:translateY(24px);
  transition:opacity 1s ease .12s, transform 1s cubic-bezier(.2,.7,.2,1) .12s}
.ev.in .card{opacity:1;transform:none}
.time{color:var(--gold);font-size:14px;display:inline-flex;align-items:center;gap:9px}
.time .ico{width:18px;height:18px;opacity:.9;flex:none}
.card h3{font-weight:400;font-size:clamp(29px,7.6vw,38px);line-height:1.08;margin:6px 0 2px;text-wrap:balance}
.sub{font-style:italic;color:var(--gold-hi);font-size:21px;line-height:1.3}
.note{color:var(--muted);font-size:19px;line-height:1.45;margin-top:8px;max-width:30ch}
.pair{margin-top:10px;font-size:16px;line-height:1.45;color:#c3b2a2}
.pair .sc{color:var(--gold);font-size:12px;margin-right:6px;display:block}

/* live weekend */
.nowtag{display:none;margin-bottom:4px}
.ev.now .nowtag,.ev.next .nowtag{display:flex}
.ev.next .nowtag .pulse{animation:none;background:none;border:1px solid var(--gold)}
.ev.now .node svg{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px rgba(230,189,114,.6))}}
.ev.past .time{color:var(--muted)}
.ev.past h3{color:#cdbfb1}
.nowpill{position:fixed;z-index:21;left:50%;bottom:calc(16px + var(--sab));transform:translate(-50%,160%);display:flex;align-items:center;gap:10px;
  max-width:calc(100vw - 32px);min-height:46px;padding:8px 20px 8px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(31,14,19,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--cream);font:inherit;font-size:18px;cursor:pointer;
  box-shadow:0 14px 30px -10px #000;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.nowpill.on{transform:translate(-50%,0)}
.nowpill b{font-family:'Cormorant SC',serif;color:var(--gold);font-size:13px;letter-spacing:.14em;font-weight:500;flex:none}
.nowpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* surprise */
.peek{margin-top:14px;min-height:44px;background:rgba(201,163,92,.04);border:1px solid var(--line);color:var(--gold);font:inherit;font-size:17px;font-style:italic;
  padding:8px 20px;border-radius:99px;cursor:pointer;transition:background .3s,border-color .3s,transform .15s}
.peek:active{transform:scale(.96)}
@media (hover:hover){.peek:hover{background:rgba(201,163,92,.1);border-color:var(--gold)}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-5px) rotate(-.6deg)}40%,80%{transform:translateX(5px) rotate(.6deg)}}

/* bubbles */
.bubbles{position:absolute;inset:-10px -10px -10px -20px;overflow:hidden;pointer-events:none}
.bubbles i{position:absolute;bottom:-10px;aspect-ratio:1;border-radius:50%;border:1px solid rgba(236,210,154,.6);opacity:0}
.ev.in .bubbles i{animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-240px);opacity:0}}

/* ——— Pour bar (top bar on mobile, corner glass on desktop) ——— */
.bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(8px + var(--sat)) var(--gutter) 8px;
  background:linear-gradient(rgba(21,10,13,.92),rgba(21,10,13,.78));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(201,163,92,.14);transform:translateY(-110%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.bar.on{transform:none}
.bar-day{font-size:20px;display:flex;align-items:baseline;gap:10px;min-width:0}
.bar-day b{font-family:'Cormorant SC',serif;color:var(--gold);font-weight:600;font-size:14px;letter-spacing:.1em}
.bar-day span{transition:opacity .3s}
.pour{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.pour svg{width:22px;height:36px;overflow:visible}

/* ——— Finale ——— */
.finale{min-height:90vh;min-height:90svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12vh var(--gutter)}
.finale h2{font-size:clamp(54px,15vw,96px);font-weight:300;font-style:italic;line-height:1}
.finale p{color:var(--muted);margin-top:12px;max-width:26ch}
.toast{width:200px;height:155px;margin:34px auto 8px;overflow:visible}
.toast .gl{transition:transform .5s cubic-bezier(.5,0,.5,1.4);transform-box:fill-box;transform-origin:50% 100%}
.toast.clink .gl.a{transform:translateX(22px) rotate(16deg)}
.toast.clink .gl.b{transform:translateX(-22px) rotate(-16deg)}
.raise{min-height:52px;background:var(--wine);color:var(--cream);border:1px solid var(--wine-hi);font:inherit;font-size:21px;font-style:italic;
  padding:10px 36px;border-radius:99px;cursor:pointer;transition:transform .15s,background .3s;box-shadow:0 10px 40px -10px rgba(142,42,58,.7)}
.raise:active{transform:scale(.96)}
@media (hover:hover){.raise:hover{background:var(--wine-hi);transform:translateY(-2px)}}
.cheers{height:40px;margin-top:18px;font-size:28px;font-style:italic;color:var(--gold-hi);opacity:0;transition:opacity .6s}
.cheers.on{opacity:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 var(--gutter) calc(40px + var(--sab))}

/* sparks */
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);pointer-events:none;z-index:50;
  box-shadow:0 0 8px 1px rgba(236,210,154,.7);animation:spark .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ——— Larger screens: alternating timeline ——— */
@media (min-width:761px){
  :root{--gutter:32px}
  .events{padding:10px 16px 20px}
  .ev{grid-template-columns:1fr 110px 1fr;column-gap:0;align-items:center;min-height:190px;padding:0}
  .ev .node{grid-column:2;padding:0}
  .ev .card{grid-column:1;text-align:right;padding:22px 26px;filter:blur(6px);transition:opacity 1.1s ease .15s, transform 1.1s cubic-bezier(.2,.7,.2,1) .15s, filter 1.1s ease .15s}
  .ev.in .card{filter:none}
  .ev.r .card{grid-column:3;text-align:left}
  .ev:not(.r) .time{flex-direction:row-reverse}
  .ev:not(.r) .note{margin-left:auto}
  .node svg{width:64px;height:76px}
  .pair .sc{display:inline}
  .note{max-width:360px}
  .seal{width:96px;height:96px}
  .day-theme{max-width:none}.day-theme em{display:inline}.day-theme em::after{content:" — ";font-style:normal;color:var(--muted)}
  .bar{left:auto;right:22px;top:auto;bottom:22px;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;transform:none;pointer-events:none}
  .bar-day{display:none}
  .nowpill{left:22px;transform:translate(0,160%)}
  .nowpill.on{transform:none}
  .pour{flex-direction:column;gap:4px;font-size:11px}
  .pour svg{width:44px;height:74px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow sc">Welcome to</p>
  <h1 class="foil">The Stag</h1>
  <p class="honour sc">for our beloved <span id="groom"></span></p>
  <p class="lede"><em id="tagline"></em></p>
  <div class="rule" aria-hidden="true"><span></span>❦<span></span></div>
  <p class="dates sc" id="dates"></p>
  <div class="status" id="status" aria-live="off"></div>
  <a class="cue sc" href="#fri"><span id="cueText">Begin the pour</span><i></i></a>
</header>

<main id="timeline"></main>

<section class="finale reveal">
  <p class="sc" style="color:var(--gold);font-size:14px">And finally</p>
  <h2 id="toGroom">To the groom.</h2>
  <p>Three days. One vineyard too many. Friends for life.</p>
  <svg class="toast" id="toast" viewBox="0 0 220 170" fill="none" stroke="#c9a35c" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
    <defs>
      <clipPath id="bowlA"><path d="M60 20h44c2 26-4 46-22 50-18-4-24-24-22-50z"/></clipPath>
      <clipPath id="bowlB"><path d="M116 20h44c2 26-4 46-22 50-18-4-24-24-22-50z"/></clipPath>
    </defs>
    <g class="gl a">
      <rect clip-path="url(#bowlA)" x="50" y="44" width="70" height="40" fill="#6b1d2a" stroke="none"/>
      <path d="M60 20h44c2 26-4 46-22 50-18-4-24-24-22-50zM82 70v62M66 136h32"/>
    </g>
    <g class="gl b">
      <rect clip-path="url(#bowlB)" x="106" y="44" width="70" height="40" fill="#6b1d2a" stroke="none"/>
      <path d="M116 20h44c2 26-4 46-22 50-18-4-24-24-22-50zM138 70v62M122 136h32"/>
    </g>
  </svg>
  <button class="raise" id="raise">Raise a glass</button>
  <div class="cheers" id="cheers" aria-live="polite"></div>
</section>
<footer class="sc">16 · 17 · 18 October · Kent</footer>

<button class="nowpill" id="nowpill" aria-label="Jump to what's happening now"></button>
<div class="bar" id="bar" aria-hidden="true">
  <div class="bar-day"><b id="barNum">I</b><span id="barDay">Friday</span></div>
  <div class="pour">
    <span class="sc" id="pourPct">the pour</span>
    <svg viewBox="0 0 60 100">
      <defs><clipPath id="bowl"><path d="M10 6H50C52 30 48 50 30 54 12 50 8 30 10 6Z"/></clipPath></defs>
      <g clip-path="url(#bowl)"><path id="liquid" fill="#8a2335"/></g>
      <path d="M10 6H50C52 30 48 50 30 54 12 50 8 30 10 6ZM30 54V90M17 94H43" fill="none" stroke="#c9a35c" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<script>
const W = WEEKEND;
const desktop = matchMedia('(min-width:761px)');
document.getElementById('tagline').textContent = W.tagline;
document.getElementById('groom').textContent = W.groom;
document.getElementById('toGroom').textContent = 'To ' + W.groomFirst + '.';
document.getElementById('dates').innerHTML = W.dates.replace(' – ', ' –<br>') + ' · ' + W.place;


// Wax seal blob
function blob(cx,cy,r,n,j,seed){
  let s=seed; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const pts=[...Array(n)].map((_,i)=>{const a=i/n*Math.PI*2,rr=r+(rnd()-.5)*j;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]});
  const mid=(p,q)=>[((p[0]+q[0])/2).toFixed(1),((p[1]+q[1])/2).toFixed(1)];
  let d=`M${mid(pts[n-1],pts[0])}`;
  pts.forEach((p,i)=>{d+=`Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${mid(p,pts[(i+1)%n])}`});
  return d+'Z';
}
const grapes = `
  <path d="M32 2C32 8 32 12 32 16" stroke="#6e7d3a" stroke-width="1.4" fill="none"/>
  <path d="M32 10c-7-3-12 1-10 6s7 1 5-3" stroke="#6e7d3a" stroke-width="1" fill="none"/>
  <path class="leafy" d="M33 9C40 0 52 1 57 7 51 13 40 14 33 9Z"/>
  ${[[20,24],[32,22],[44,24],[26,35],[38,35],[20,46],[44,46],[32,47],[26,58],[38,58],[32,69]]
    .map(([x,y],i)=>`<circle class="grape" cx="${x}" cy="${y}" r="6.6" style="transition-delay:${(.25+i*.07).toFixed(2)}s"/>
                    <circle class="grape-hi" cx="${x-2}" cy="${y-2.4}" r="1.6"/>`).join('')}`;

const bubbles = () => `<div class="bubbles">${[...Array(14)].map(()=>`<i style="left:${(Math.random()*100).toFixed(0)}%;width:${(3+Math.random()*4).toFixed(0)}px;animation-duration:${(3+Math.random()*4).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;--dx:${((Math.random()-.5)*30).toFixed(0)}px"></i>`).join('')}</div>`;

const tl = document.getElementById('timeline');
W.days.forEach((day,di)=>{
  const sec=document.createElement('section'); sec.className='day'; sec.id=day.key;
  sec.dataset.num=day.numeral; sec.dataset.name=day.name;
  sec.innerHTML=`
    <div class="day-head reveal">
      <div class="ghost" aria-hidden="true">${day.name}</div>
      <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
        <path d="${blob(50,50,44,14,8,di*7+3)}" fill="#7d1f2d"/>
        <path d="${blob(50,50,33,12,3,di*5+11)}" fill="none" stroke="#5a1220" stroke-width="2.5"/>
        <path d="${blob(48,46,30,10,3,di*3+2)}" fill="none" stroke="#a33a48" stroke-width="1" opacity=".5"/>
        <text x="50" y="59" text-anchor="middle">${day.numeral}</text>
      </svg>
      <p class="sc day-date">${day.date}</p>
      <h2 class="day-name">${day.name}</h2>
      <p class="day-theme"><em>${day.theme}</em>${day.line}</p>
    </div>
    <div class="events">
      <svg class="vine" aria-hidden="true"><path class="shadow"/><path class="main"/></svg>
      ${day.events.map((e,i)=>`
        <article class="ev ${i%2?'r':''}">
          <div class="card">
            ${e.bubbles?bubbles():''}
            <span class="nowtag sc"><i class="pulse"></i><span>Happening now</span></span>
            <span class="time sc">${icon(e.icon)}${e.time}</span>
            <h3>${e.title}</h3>
            ${e.sub?`<div class="sub">${e.sub}</div>`:''}
            <p class="note">${e.note}</p>
            ${e.surprise
              ? `<button class="peek">Peek at the surprise</button>`
              : `<p class="pair"><span class="sc">Pairs with</span><em>${e.pair}</em></p>`}
          </div>
          <div class="node" aria-hidden="true"><svg viewBox="0 0 64 76">${grapes}</svg></div>
        </article>`).join('')}
    </div>`;
  tl.appendChild(sec);
});

// Haptic tick where supported (Android); silently ignored elsewhere
const buzz = p => { try{ const u=navigator.userActivation; if(navigator.vibrate && (!u || u.hasBeenActive)) navigator.vibrate(p) }catch(e){} };

// Surprise teasing
const quips=['Sealed until 20:00.','Nice try.','Our lips are sealed. With wax.','The groom will find out soon enough.','Still no.','Persistent, aren\'t we?'];
document.querySelectorAll('.peek').forEach(b=>{let n=0;b.addEventListener('click',e=>{
  const card=b.closest('.card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  b.textContent=quips[n++%quips.length];
  const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,10); buzz([12,40,12]);
})});

// Reveal on view
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.reveal,.ev').forEach(el=>io.observe(el));

// Vines: snake through the grape nodes
const vines=[...document.querySelectorAll('.events')].map(box=>({box,paths:box.querySelectorAll('.vine path'),len:0}));
function buildVines(){
  vines.forEach(v=>{
    const node=v.box.querySelector('.node');
    const nr=node.getBoundingClientRect(), x=nr.left-v.box.getBoundingClientRect().left+nr.width/2, h=v.box.clientHeight;
    const amp=desktop.matches?26:9, seg=desktop.matches?110:90;
    let d=`M${x},0`, y=0, s=1;
    while(y<h){const ny=Math.min(y+seg,h);d+=` C${x+amp*s},${y+seg*.33} ${x-amp*s},${y+seg*.66} ${x},${ny}`;y=ny;s*=-1}
    v.paths.forEach(p=>p.setAttribute('d',d));
    v.len=v.paths[1].getTotalLength();
    v.paths.forEach(p=>{p.style.strokeDasharray=v.len});
  });
  update();
}

// Scroll-driven bits, batched to one frame
const liquid=document.getElementById('liquid'), pct=document.getElementById('pourPct');
const bar=document.getElementById('bar'), barNum=document.getElementById('barNum'), barDay=document.getElementById('barDay');
const hero=document.querySelector('.hero'), days=[...document.querySelectorAll('.day')];
const ghosts=[...document.querySelectorAll('.ghost')];
let pour=0, queued=false, curDay='';
function update(){
  queued=false;
  const vh=innerHeight;
  vines.forEach(v=>{
    const r=v.box.getBoundingClientRect();
    if(r.bottom<-vh||r.top>vh*2)return;
    let p=Math.max(0,Math.min(1,(vh*.72-r.top)/r.height));
    const reach=LIVE&&LIVE.reachEl;   // during the weekend, the vine is always grown up to now
    if(reach){
      if(v.box.contains(reach)){const n=reach.querySelector('.node').getBoundingClientRect();p=Math.max(p,(n.top+n.height/2-r.top)/r.height)}
      else if(v.box.compareDocumentPosition(reach)&Node.DOCUMENT_POSITION_FOLLOWING)p=1;
    }
    v.paths.forEach(path=>path.style.strokeDashoffset=v.len*(1-p));
  });
  ghosts.forEach(g=>{const r=g.parentElement.getBoundingClientRect();if(r.bottom>-vh&&r.top<vh*2)g.style.transform=`translateX(-50%) translateY(${((r.top-vh*.3)*-.15).toFixed(1)}px)`});
  const max=document.documentElement.scrollHeight-vh;
  pour=max>0?Math.min(1,scrollY/max):0;
  pct.textContent=pour>.985?'à votre santé':(desktop.matches?'the pour · ':'')+Math.round(pour*100)+'%';
  bar.classList.toggle('on',hero.getBoundingClientRect().bottom<60);
  if(LIVE)livePill();
  let d=days[0];days.forEach(s=>{if(s.getBoundingClientRect().top<vh*.4)d=s});
  if(d.dataset.name!==curDay){curDay=d.dataset.name;barDay.style.opacity=0;
    setTimeout(()=>{barNum.textContent=d.dataset.num;barDay.textContent=d.dataset.name;barDay.style.opacity=1},200)}
}
const onScroll=()=>{if(!queued){queued=true;requestAnimationFrame(update)}};
function slosh(t){
  const y=54-pour*46, a=REDUCED?0:1.6*Math.sin(t/420);
  liquid.setAttribute('d',`M0 ${(y+a).toFixed(2)} Q15 ${(y-2-a).toFixed(2)} 30 ${y.toFixed(2)} T60 ${(y-a).toFixed(2)} V60 H0Z`);
  requestAnimationFrame(slosh);
}
addEventListener('scroll',onScroll,{passive:true});
let lastW=innerWidth;
addEventListener('resize',()=>{if(innerWidth!==lastW){lastW=innerWidth;buildVines()}else onScroll()}); // ignore mobile URL-bar height changes
document.fonts.ready.then(buildVines); buildVines(); requestAnimationFrame(slosh);

// Gold sparks on tap
function burst(x,y,n=8){
  if(REDUCED)return;
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';
    const a=Math.random()*Math.PI*2,d=30+Math.random()*50;
    s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
}
addEventListener('click',e=>{if(!e.target.closest('button,a'))burst(e.clientX,e.clientY,6)});

// ——— Before / during / after the weekend ———
// Preview any moment with ?now=2026-10-17T10:30 (UK time); the clock keeps ticking from there.
var LIVE = null;
const OFFSET = (()=>{
  const q = new URLSearchParams(location.search).get('now');
  const t = q ? Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(q) ? q : q + '+01:00') : NaN;
  return isNaN(t) ? 0 : t - Date.now();
})();
const now = () => Date.now() + OFFSET;
const HOLD = 4 * 36e5;   // an event counts as "happening now" for up to 4 hours
const pad = n => String(n).padStart(2,'0');
const EVS = [];
const evEls = [...document.querySelectorAll('.ev')];
W.days.forEach(d => d.events.forEach(e => {
  const h = Math.floor(e.hour), m = Math.round((e.hour - h) * 60);
  const el = evEls[EVS.length]; el.id = 'ev-' + EVS.length;
  EVS.push({ e, d, el, t: Date.parse(`${d.iso}T${pad(h)}:${pad(m)}:00+01:00`) });
}));
const START = Date.parse(W.start), END = EVS[EVS.length-1].t + HOLD;

function stateAt(t){
  if(t < START) return { phase:'before' };
  if(t >= END) return { phase:'after' };
  let i = 0; while(i + 1 < EVS.length && EVS[i+1].t <= t) i++;
  const between = t >= EVS[i].t + HOLD;   // e.g. overnight, before the next plan starts
  return { phase:'live', i, between, focus: between ? i + 1 : i };
}

const statusEl = document.getElementById('status'), cueText = document.getElementById('cueText');
const nowpill = document.getElementById('nowpill');
const countHTML = c => `<div class="count">${[['d','days'],['h','hours'],['m','mins'],['s','secs']]
  .map(([k,l]) => `<div><b>${pad(c[k])}</b><small>${l}</small></div>`).join('')}</div>`;
const whenLabel = x => /\d/.test(x.e.time) ? `${x.d.name} at ${x.e.time}` : `${x.d.name} ${x.e.time.toLowerCase()}`;
const jump = el => el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });

function renderStatus(st){
  if(st.phase === 'after'){
    statusEl.innerHTML = `<div class="wrap"><b>That's a wrap.</b><small>16 – 18 October 2026</small></div>`;
    cueText.textContent = 'Relive the weekend';
    return;
  }
  const f = EVS[st.focus], nx = EVS[st.focus + 1];
  statusEl.innerHTML = `<div class="live">
      <span class="live-tag sc"><i class="pulse"></i>${st.between ? 'Up next' : 'Happening now'}</span>
      <a class="live-now" href="#${f.el.id}">${f.e.title}</a>
      <span class="live-next">${st.between ? whenLabel(f)
        : nx ? `Then ${/\d/.test(nx.e.time) ? 'at ' + nx.e.time : 'next'}: ${nx.e.title}` : 'The final chapter'}</span>
    </div>`;
  statusEl.querySelector('.live-now').addEventListener('click', ev => { ev.preventDefault(); jump(f.el) });
  cueText.textContent = 'Follow along';
}

function applyTimeline(st){
  EVS.forEach((x,k) => {
    const isNow = st.phase === 'live' && !st.between && k === st.i;
    const isNext = st.phase === 'live' && st.between && k === st.focus;
    x.el.classList.toggle('now', isNow);
    x.el.classList.toggle('next', isNext);
    x.el.classList.toggle('past', st.phase === 'live' && k < st.focus && !isNow);
    if(isNow || isNext) x.el.querySelector('.nowtag span').textContent = isNow ? 'Happening now' : 'Up next';
  });
  LIVE = st.phase === 'live' ? { st, focusEl: EVS[st.focus].el, reachEl: EVS[st.i].el } : { st };
  if(st.phase === 'live') nowpill.innerHTML = `<i class="pulse"></i><b>${st.between ? 'Next' : 'Now'}</b><span>${EVS[st.focus].e.title}</span>`;
  onScroll();
}

function livePill(){
  const st = LIVE.st;
  if(st.phase !== 'live'){ nowpill.classList.remove('on'); return }
  const r = LIVE.focusEl.getBoundingClientRect();
  const away = hero.getBoundingClientRect().bottom < 0 && (r.bottom < 60 || r.top > innerHeight - 80);
  nowpill.classList.toggle('on', away);
}
nowpill.addEventListener('click', () => LIVE && LIVE.focusEl && jump(LIVE.focusEl));

// The moment the countdown hits zero (only if the page is open at 10:15)
let celebrating = false;
function celebrate(st){
  celebrating = true;
  statusEl.innerHTML = countHTML({ d:0, h:0, m:0, s:0 });
  statusEl.firstElementChild.classList.add('zero');
  setTimeout(() => {
    const r = statusEl.getBoundingClientRect();
    [0,1,2,3].forEach(k => setTimeout(() => burst(r.left + r.width * (.2 + .2*k), r.top + r.height/2, 16), k * 110));
    buzz([30,60,30]);
    statusEl.innerHTML = `<div class="begun">It's begun.</div>`;
  }, 900);
  setTimeout(() => { celebrating = false; renderStatus(st); applyTimeline(st) }, 4600);
}

let lastKey = null;
function tick(){
  if(celebrating) return;
  const t = now(), st = stateAt(t);
  const key = st.phase + (st.phase === 'live' ? st.i + ':' + st.between : '');
  if(st.phase === 'before'){
    const ms = START - t;
    statusEl.innerHTML = countHTML({ d: Math.floor(ms/864e5), h: Math.floor(ms/36e5)%24, m: Math.floor(ms/6e4)%60, s: Math.floor(ms/1e3)%60 });
    if(key !== lastKey){ applyTimeline(st) }
  } else if(key !== lastKey){
    if(lastKey === 'before' && st.phase === 'live') celebrate(st);
    else { renderStatus(st); applyTimeline(st) }
  }
  lastKey = key;
}
tick(); setInterval(tick, 1000);

// Finale clink
const toast=document.getElementById('toast'), cheers=document.getElementById('cheers');
document.getElementById('raise').addEventListener('click',()=>{
  toast.classList.remove('clink'); void toast.offsetWidth; toast.classList.add('clink');
  setTimeout(()=>{const r=toast.getBoundingClientRect();burst(r.left+r.width/2,r.top+30,22);buzz(30);
    cheers.textContent='To you and Chris';cheers.classList.add('on')},420);
  setTimeout(()=>toast.classList.remove('clink'),1600);
});
</script>
</body>
</html>
