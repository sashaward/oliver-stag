<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Stag · The Cellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../data.js"></script>
<style>
:root{
  --bg:#150a0d; --bg2:#1f0e13; --wine:#6b1d2a; --wine-hi:#8e2a3a;
  --gold:#c9a35c; --gold-hi:#ecd29a; --cream:#efe4d2; --muted:#a8968b; --line:rgba(201,163,92,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 120% 60% at 50% 0%,#2c1118 0%,transparent 70%),
                   radial-gradient(ellipse 80% 50% at 50% 100%,#24101a 0%,transparent 70%);
  color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
.sc{font-family:'Cormorant SC',serif;letter-spacing:.18em;font-weight:500}
em{font-style:italic}

/* ——— Hero ——— */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 16px 60px;position:relative}
.eyebrow{color:var(--gold);font-size:15px;opacity:0;animation:fadeUp 1.2s .2s forwards}
.foil{
  font-size:clamp(84px,17vw,210px);font-weight:300;font-style:italic;line-height:.95;margin:.12em 0 .1em;
  background:linear-gradient(100deg,#8f6d34 0%,#ecd29a 18%,#b38945 36%,#f7e6b9 50%,#a57e3d 66%,#e6c98a 84%,#8f6d34 100%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:settle 2.2s cubic-bezier(.2,.7,.2,1) .35s both, foil 7s linear 2.5s infinite;
}
@keyframes settle{from{letter-spacing:.35em;opacity:0;filter:blur(14px)}to{letter-spacing:0;opacity:1;filter:blur(0)}}
@keyframes foil{to{background-position:-220% center}}
.lede{font-size:clamp(22px,3vw,30px);font-weight:300;color:var(--cream);opacity:0;animation:fadeUp 1.2s 1.3s forwards}
.rule{display:flex;align-items:center;gap:18px;color:var(--gold);margin:28px 0 22px;opacity:0;animation:fadeUp 1s 1.6s forwards}
.rule span{display:block;width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule span:last-child{transform:scaleX(-1)}
.dates{color:var(--muted);font-size:15px;opacity:0;animation:fadeUp 1s 1.8s forwards}
.count{display:flex;gap:28px;margin-top:38px;opacity:0;animation:fadeUp 1s 2.1s forwards}
.count div{display:flex;flex-direction:column;align-items:center;min-width:56px}
.count b{font-weight:300;font-size:44px;line-height:1;color:var(--gold-hi);font-variant-numeric:lining-nums tabular-nums}
.count small{font-family:'Cormorant SC',serif;letter-spacing:.2em;font-size:12px;color:var(--muted);margin-top:6px}
.cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--gold);text-decoration:none;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeUp 1s 2.6s forwards}
.cue i{display:block;width:1px;height:46px;background:linear-gradient(var(--gold),transparent);transform-origin:top;animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cue{transform:translateX(-50%)}
@keyframes fadeUpC{from{opacity:0}to{opacity:1}}
.cue{animation-name:fadeUpC}

/* ——— Day heads ——— */
.day{position:relative;padding:12vh 0 4vh}
.day-head{text-align:center;padding:0 16px 7vh;position:relative}
.ghost{position:absolute;left:50%;top:-4vh;transform:translateX(-50%);font-size:clamp(120px,24vw,320px);font-style:italic;font-weight:300;
  color:transparent;-webkit-text-stroke:1px rgba(201,163,92,.12);white-space:nowrap;pointer-events:none;z-index:0;will-change:transform}
.seal{width:96px;height:96px;margin:0 auto 22px;position:relative;z-index:1;opacity:0;transform:scale(1.8) rotate(-25deg)}
.day-head.in .seal{animation:stamp .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{60%{opacity:1;transform:scale(.92) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.seal text{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;fill:#e8b9a0;opacity:.85}
.day-date{color:var(--gold);font-size:15px;position:relative;z-index:1}
.day-name{font-size:clamp(56px,9vw,104px);font-weight:300;line-height:1;margin:.1em 0 .12em;position:relative;z-index:1}
.day-theme{font-size:24px;color:var(--muted);position:relative;z-index:1}
.day-theme em{color:var(--cream)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ——— Timeline ——— */
.events{position:relative;max-width:1040px;margin:0 auto;padding:10px 16px 20px}
.vine{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.vine path{fill:none;stroke:#6e7d3a;stroke-width:1.6;stroke-linecap:round}
.vine .shadow{stroke:rgba(0,0,0,.4);stroke-width:4;filter:blur(2px)}
.ev{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;min-height:190px;position:relative}
.ev .card{grid-column:1;grid-row:1;text-align:right}
.ev .node{grid-column:2;grid-row:1}
.ev.r .card{grid-column:3;text-align:left}
.node{display:flex;justify-content:center;position:relative;z-index:2}
.node svg{width:64px;height:76px;overflow:visible}
.grape{fill:#56622b;transform:scale(.15);transform-box:fill-box;transform-origin:center;transition:fill 1.6s ease, transform .9s cubic-bezier(.3,1.7,.5,1)}
.ev.in .grape{fill:#5c1832;transform:scale(1)}
.grape-hi{fill:#fff;opacity:0;transition:opacity 1s 1s}
.ev.in .grape-hi{opacity:.22}
.leafy{fill:#4b5a26;opacity:0;transform:scale(.3) rotate(-30deg);transform-box:fill-box;transform-origin:left bottom;transition:all 1s cubic-bezier(.3,1.5,.5,1) .2s}
.ev.in .leafy{opacity:1;transform:none}
.card{position:relative;padding:22px 26px;opacity:0;transform:translateY(30px);filter:blur(6px);
  transition:opacity 1.1s ease .15s, transform 1.1s cubic-bezier(.2,.7,.2,1) .15s, filter 1.1s ease .15s}
.ev.in .card{opacity:1;transform:none;filter:none}
.time{color:var(--gold);font-size:15px;display:inline-flex;align-items:center;gap:10px}
.time .ico{width:18px;height:18px;opacity:.85}
.ev:not(.r) .time{flex-direction:row-reverse}
.card h3{font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.1;margin:6px 0 2px}
.sub{font-style:italic;color:var(--gold-hi);font-size:21px}
.note{color:var(--muted);font-size:19px;margin-top:8px;max-width:360px}
.ev:not(.r) .note{margin-left:auto}
.pair{margin-top:12px;font-size:15px;color:#c3b2a2}
.pair .sc{color:var(--gold);font-size:12px;margin-right:6px}

/* surprise */
.peek{margin-top:14px;background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:15px;padding:6px 16px;border-radius:99px;cursor:pointer;transition:background .3s,border-color .3s}
.peek:hover{background:rgba(201,163,92,.08);border-color:var(--gold)}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-5px) rotate(-.6deg)}40%,80%{transform:translateX(5px) rotate(.6deg)}}
.redact{background:var(--cream);color:transparent;border-radius:2px;padding:0 4px;letter-spacing:.06em}

/* bubbles */
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:8px}
.bubbles i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;border:1px solid rgba(236,210,154,.6);opacity:0}
.ev.in .bubbles i{animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-240px);opacity:0}}

/* ——— Pour gauge ——— */
.pour{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;pointer-events:none}
.pour svg{width:44px;height:74px;overflow:visible}
.pour .sc{letter-spacing:.2em}

/* ——— Finale ——— */
.finale{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12vh 16px}
.finale h2{font-size:clamp(48px,8vw,96px);font-weight:300;font-style:italic;line-height:1}
.finale p{color:var(--muted);margin-top:10px}
.toast{width:220px;height:170px;margin:40px auto 10px;overflow:visible}
.toast .gl{transition:transform .5s cubic-bezier(.5,0,.5,1.4);transform-box:fill-box;transform-origin:50% 100%}
.toast.clink .gl.a{transform:translateX(22px) rotate(16deg)}
.toast.clink .gl.b{transform:translateX(-22px) rotate(-16deg)}
.raise{background:var(--wine);color:var(--cream);border:1px solid var(--wine-hi);font:inherit;font-size:20px;font-style:italic;padding:12px 34px;border-radius:99px;cursor:pointer;transition:transform .2s,background .3s;box-shadow:0 10px 40px -10px rgba(142,42,58,.7)}
.raise:hover{background:var(--wine-hi);transform:translateY(-2px)}
.cheers{height:40px;margin-top:20px;font-size:28px;font-style:italic;color:var(--gold-hi);opacity:0;transition:opacity .6s}
.cheers.on{opacity:1}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 50px}

/* sparks */
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);pointer-events:none;z-index:50;
  box-shadow:0 0 8px 1px rgba(236,210,154,.7);animation:spark .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

@media (max-width:760px){
  .ev,.ev.r{grid-template-columns:64px 1fr;min-height:0;padding:14px 0}
  .ev .card,.ev.r .card{grid-column:2;text-align:left;padding:10px 6px 10px 10px}
  .ev .node{grid-column:1}
  .ev:not(.r) .time{flex-direction:row}
  .ev:not(.r) .note{margin-left:0}
  .count{gap:16px}.count b{font-size:34px}
  .pour{right:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow sc">You are cordially invited to</p>
  <h1 class="foil">The Stag</h1>
  <p class="lede"><em id="tagline"></em></p>
  <div class="rule"><span></span>❦<span></span></div>
  <p class="dates sc" id="dates"></p>
  <div class="count" id="count"></div>
  <a class="cue sc" href="#fri">Begin the pour<i></i></a>
</header>

<main id="timeline"></main>

<section class="finale reveal">
  <p class="sc" style="color:var(--gold);font-size:14px">And finally</p>
  <h2>To the groom.</h2>
  <p>Three days. One vineyard too many. Friends for life.</p>
  <svg class="toast" id="toast" viewBox="0 0 220 170" fill="none" stroke="#c9a35c" stroke-width="1.4" stroke-linecap="round">
    <defs>
      <clipPath id="bowlA"><path d="M60 20h44c2 26-4 46-22 50-18-4-24-24-22-50z"/></clipPath>
      <clipPath id="bowlB"><path d="M116 20h44c2 26-4 46-22 50-18-4-24-24-22-50z"/></clipPath>
    </defs>
    <g class="gl a">
      <rect clip-path="url(#bowlA)" x="50" y="44" width="70" height="40" fill="#6b1d2a" stroke="none"/>
      <path d="M60 20h44c2 26-4 46-22 50-18-4-24-24-22-50zM82 70v62M66 136h32"/>
    </g>
    <g class="gl b">
      <rect clip-path="url(#bowlB)" x="106" y="44" width="70" height="40" fill="#6b1d2a" stroke="none"/>
      <path d="M116 20h44c2 26-4 46-22 50-18-4-24-24-22-50zM138 70v62M122 136h32"/>
    </g>
  </svg>
  <button class="raise" id="raise">Raise a glass</button>
  <div class="cheers" id="cheers">Cheers!</div>
</section>
<footer class="sc">16 · 17 · 18 October · Kent</footer>

<div class="pour" aria-hidden="true">
  <svg viewBox="0 0 60 100">
    <defs><clipPath id="bowl"><path d="M10 6H50C52 30 48 50 30 54 12 50 8 30 10 6Z"/></clipPath></defs>
    <g clip-path="url(#bowl)"><path id="liquid" fill="#7a1f2e"/></g>
    <path d="M10 6H50C52 30 48 50 30 54 12 50 8 30 10 6ZM30 54V90M17 94H43" fill="none" stroke="#c9a35c" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <span class="sc" id="pourPct">the pour</span>
</div>

<script>
const W = WEEKEND;
document.getElementById('tagline').textContent = W.tagline;
document.getElementById('dates').textContent = W.dates + ' · ' + W.place;

// Countdown
const countEl = document.getElementById('count');
function tick(){
  const c = countdownParts();
  if(!c){countEl.innerHTML='<div><b>Now</b><small>pour freely</small></div>';return}
  countEl.innerHTML=[['d','days'],['h','hours'],['m','minutes'],['s','seconds']]
    .map(([k,l])=>`<div><b>${String(c[k]).padStart(2,'0')}</b><small>${l}</small></div>`).join('');
}
tick(); setInterval(tick,1000);

// Wax seal blob
function blob(cx,cy,r,n,j,seed){
  let s=seed; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const pts=[...Array(n)].map((_,i)=>{const a=i/n*Math.PI*2,rr=r+(rnd()-.5)*j;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]});
  let d='';
  pts.forEach((p,i)=>{const q=pts[(i+1)%n],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    d+= i===0?`M${((pts[n-1][0]+p[0])/2).toFixed(1)},${((pts[n-1][1]+p[1])/2).toFixed(1)}`:'';
    d+=`Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`});
  return d+'Z';
}
const grapes = `
  <path d="M32 2C32 8 32 12 32 16" stroke="#6e7d3a" stroke-width="1.4" fill="none"/>
  <path d="M32 10c-7-3-12 1-10 6s7 1 5-3" stroke="#6e7d3a" stroke-width="1" fill="none"/>
  <path class="leafy" d="M33 9C40 0 52 1 57 7 51 13 40 14 33 9Z"/>
  ${[[20,24],[32,22],[44,24],[26,35],[38,35],[20,46],[44,46],[32,47],[26,58],[38,58],[32,69]]
    .map(([x,y],i)=>`<circle class="grape" cx="${x}" cy="${y}" r="6.6" style="transition-delay:${(.25+i*.07).toFixed(2)}s,${(.25+i*.07).toFixed(2)}s"/>
                    <circle class="grape-hi" cx="${x-2}" cy="${y-2.4}" r="1.6"/>`).join('')}`;

const tl = document.getElementById('timeline');
W.days.forEach((day,di)=>{
  const sec=document.createElement('section'); sec.className='day'; sec.id=day.key;
  sec.innerHTML=`
    <div class="day-head reveal">
      <div class="ghost">${day.name}</div>
      <svg class="seal" viewBox="0 0 100 100">
        <path d="${blob(50,50,44,14,8,di*7+3)}" fill="#7d1f2d"/>
        <path d="${blob(50,50,33,12,3,di*5+11)}" fill="none" stroke="#5a1220" stroke-width="2.5"/>
        <path d="${blob(48,46,30,10,3,di*3+2)}" fill="none" stroke="#a33a48" stroke-width="1" opacity=".5"/>
        <text x="50" y="59" text-anchor="middle">${day.numeral}</text>
      </svg>
      <p class="sc day-date">${day.date}</p>
      <h2 class="day-name">${day.name}</h2>
      <p class="day-theme"><em>${day.theme}</em> — ${day.line}</p>
    </div>
    <div class="events">
      <svg class="vine"><path class="shadow"/><path class="main"/></svg>
      ${day.events.map((e,i)=>`
        <article class="ev ${i%2?'r':''}">
          <div class="card">
            ${e.bubbles?`<div class="bubbles">${[...Array(16)].map(()=>`<i style="left:${Math.random()*100}%;animation-duration:${(3+Math.random()*4).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;--dx:${((Math.random()-.5)*30).toFixed(0)}px;width:${(3+Math.random()*4).toFixed(0)}px;height:auto;aspect-ratio:1"></i>`).join('')}</div>`:''}
            <span class="time sc">${icon(e.icon)}${e.time}</span>
            <h3>${e.title}</h3>
            ${e.sub?`<div class="sub">${e.sub}</div>`:''}
            <p class="note">${e.note}</p>
            ${e.surprise
              ? `<button class="peek">Peek at the surprise</button>`
              : `<p class="pair"><span class="sc">Pairs with</span><em>${e.pair}</em></p>`}
          </div>
          <div class="node"><svg viewBox="0 0 64 76">${grapes}</svg></div>
        </article>`).join('')}
    </div>`;
  tl.appendChild(sec);
});

// Surprise teasing
const quips=['Sealed until 20:00.','Nice try.','Our lips are sealed. With wax.','The groom will find out soon enough.','Still no.','Persistent, aren\'t we?'];
document.querySelectorAll('.peek').forEach(b=>{let n=0;b.addEventListener('click',e=>{
  e.stopPropagation(); const card=b.closest('.card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  b.textContent=quips[n++%quips.length];
  burst(e.clientX,e.clientY,10);
})});

// Reveal on view
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25,rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.reveal,.ev').forEach(el=>io.observe(el));

// Vines
const vines=[...document.querySelectorAll('.events')].map(box=>({box,paths:box.querySelectorAll('.vine path'),len:0}));
function buildVines(){
  const mobile=innerWidth<=760;
  vines.forEach(v=>{
    const w=v.box.clientWidth,h=v.box.clientHeight,x=mobile?16+32:w/2;
    const amp=mobile?10:26, seg=110; let d=`M${x},0`, y=0, s=1;
    while(y<h){const ny=Math.min(y+seg,h);d+=` C${x+amp*s},${y+seg*.33} ${x-amp*s},${y+seg*.66} ${x},${ny}`;y=ny;s*=-1}
    v.paths.forEach(p=>p.setAttribute('d',d));
    v.len=v.paths[1].getTotalLength();
    v.paths.forEach(p=>{p.style.strokeDasharray=v.len});
  });
  onScroll();
}

// Pour gauge + vine growth + ghost parallax
const liquid=document.getElementById('liquid'), pct=document.getElementById('pourPct');
const ghosts=[...document.querySelectorAll('.ghost')];
let pour=0, t0=performance.now();
function onScroll(){
  const vh=innerHeight;
  vines.forEach(v=>{
    const r=v.box.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(vh*.72-r.top)/r.height));
    v.paths.forEach(path=>path.style.strokeDashoffset=v.len*(1-p));
  });
  ghosts.forEach(g=>{const r=g.parentElement.getBoundingClientRect();g.style.transform=`translateX(-50%) translateY(${(r.top-vh*.3)*-.18}px)`});
  const max=document.documentElement.scrollHeight-vh;
  pour=max>0?scrollY/max:0;
  pct.textContent=pour>.985?'à votre santé':'the pour · '+Math.round(pour*100)+'%';
}
function slosh(t){
  const y=54-pour*46, a=REDUCED?0:1.6*Math.sin(t/420);
  liquid.setAttribute('d',`M0 ${y+a} Q15 ${y-2-a} 30 ${y} T60 ${y-a} V60 H0Z`);
  requestAnimationFrame(slosh);
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',buildVines);
document.fonts.ready.then(buildVines); buildVines(); requestAnimationFrame(slosh);

// Gold sparks on click
function burst(x,y,n=8){
  if(REDUCED)return;
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';
    const a=Math.random()*Math.PI*2,d=30+Math.random()*50;
    s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
}
addEventListener('pointerdown',e=>{if(!e.target.closest('button,a'))burst(e.clientX,e.clientY,6)});

// Finale clink
const toast=document.getElementById('toast');
document.getElementById('raise').addEventListener('click',e=>{
  toast.classList.remove('clink'); void toast.offsetWidth; toast.classList.add('clink');
  setTimeout(()=>{const r=toast.getBoundingClientRect();burst(r.left+r.width/2,r.top+30,22);document.getElementById('cheers').classList.add('on')},420);
  setTimeout(()=>toast.classList.remove('clink'),1600);
});
</script>
</body>
</html>
